{% extends "base.html" %}
{% block title %}{{ t("nav.articles") }}{% endblock %}
{% block content %}
<h1>{{ t("nav.articles") }}</h1>
<ul>
{% for article in articles %}<li><a href="{{ article.href }}">{{ article.title }}</a> <time datetime="{{ article.date }}">{{ article.date }}</time></li>
{% endfor %}
</ul>
{% endblock %}
