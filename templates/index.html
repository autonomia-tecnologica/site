{% extends "base.html" %}
{% block content %}
{% if home %}<article class="prose">
<h1>{{ home.title }}</h1>
{{ home.body|safe }}
</article>
{% endif %}
<ul>
{% if has_articles %}<li><a href="{{ articles_href }}">{{ t("nav.articles") }}</a></li>
{% endif %}
{% for page in pages %}<li><a href="{{ page.href }}">{{ page.title }}</a></li>
{% endfor %}
</ul>
{% endblock %}
